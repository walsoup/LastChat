name: Debug Build

on:
  push:
    branches:
      - LastChat_dev
      - agent-port
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: npm ci || npm install

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false

      - name: Add Rust Android Targets
        run: rustup target add aarch64-linux-android x86_64-linux-android armv7-linux-androideabi

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Antigravity Proxy
        env:
          RUSTFLAGS: "-A warnings"
        run: |
          cd antigravity-proxy-rust
          
          # Compile all targets
          cargo ndk -t arm64-v8a build --release
          cargo ndk -t x86_64 build --release
          cargo ndk -t armeabi-v7a build --release
          
          # Create jniLibs dirs
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          mkdir -p ../app/src/main/jniLibs/x86_64
          mkdir -p ../app/src/main/jniLibs/armeabi-v7a
          
          # Copy and rename to .so
          cp target/aarch64-linux-android/release/antigravity-proxy-rust ../app/src/main/jniLibs/arm64-v8a/libantigravity-proxy.so
          cp target/x86_64-linux-android/release/antigravity-proxy-rust ../app/src/main/jniLibs/x86_64/libantigravity-proxy.so
          cp target/armv7-linux-androideabi/release/antigravity-proxy-rust ../app/src/main/jniLibs/armeabi-v7a/libantigravity-proxy.so

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Create dummy google-services.json
        run: |
          cat > app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "dummy-project",
              "storage_bucket": "dummy-project.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "lastchat.rikkafork.cocolal"
                  }
                },
                "api_key": [
                  {
                    "current_key": "dummy-key"
                  }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
