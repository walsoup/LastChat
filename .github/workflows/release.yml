name: Release Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-ui dependencies
        working-directory: web-ui
        run: npm ci || npm install

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK and CMake
        run: |
          sdkmanager --install "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          targets: aarch64-linux-android,x86_64-linux-android,armv7-linux-androideabi
          cache: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build Antigravity Proxy
        run: |
          cd antigravity-proxy-rust
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          mkdir -p ../app/src/main/jniLibs/x86_64
          mkdir -p ../app/src/main/jniLibs/armeabi-v7a
          
          # Build arm64
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
          mv ../app/src/main/jniLibs/arm64-v8a/antigravity-proxy-rust ../app/src/main/jniLibs/arm64-v8a/libantigravity-proxy.so
          
          # Build x86_64
          cargo ndk -t x86_64 -o ../app/src/main/jniLibs build --release
          mv ../app/src/main/jniLibs/x86_64/antigravity-proxy-rust ../app/src/main/jniLibs/x86_64/libantigravity-proxy.so
          
          # Build armv7
          cargo ndk -t armeabi-v7a -o ../app/src/main/jniLibs build --release
          mv ../app/src/main/jniLibs/armeabi-v7a/antigravity-proxy-rust ../app/src/main/jniLibs/armeabi-v7a/libantigravity-proxy.so

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Prepare build files
        run: |
          # 解码base64编码的keystore文件
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          
          # 写入签名配置到local.properties
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          
          # 写入Google Services配置
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: artifacts
          path: app/build/outputs/apk/release/*.apk
